version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: skillgraph
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/yourpassword
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./skillgraph/backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/skillgraph
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=yourpassword
    depends_on:
      - postgres
      - neo4j
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./skillgraph/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
